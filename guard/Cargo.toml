[package]
name = "heresy-guard"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "heresy-guard"
path = "src/main.rs"

[dependencies]
brush-parser = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
